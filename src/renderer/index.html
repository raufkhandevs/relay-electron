<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Relay</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP
         connect-src allows the Reverb websocket (ws://localhost:8080); without it
         default-src 'self' blocks pusher-js's connection with no visible error. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://localhost:8080"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
